apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev: shared integration environment. Argo CD syncs automatically (argocd/applications/atlas-dev.yaml).
namespace: atlas-dev

resources:
  - namespace.yaml
  - ../../apps/namespace-baseline/base
  - ../../apps/backend/base
  - ../../apps/frontend/base
  - ../../apps/ingress/base

labels:
  - pairs:
      app.kubernetes.io/instance: atlas-dev
    includeSelectors: false
    includeTemplates: true

configMapGenerator:
  - name: atlas-backend-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=dev

patches:
  - path: backend/deployment-patch.yaml
  - path: frontend/deployment-patch.yaml
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: atlas

# Image pinning. The backend/frontend container workflows open a PR here with the immutable `main-<sha>` tag and
# digest of every image published from `main` (ADR-0007).
# Never use `latest` (enforced by scripts/validate.sh).
images:
  - name: ghcr.io/hsnrzv/atlas-backend
    newTag: main-12b2b2a1c902
    digest: sha256:07d2ca93941d7a36cbe5289ffa288a69dd58192f0cf17600bd70c776d420c0a4
  - name: ghcr.io/hsnrzv/atlas-frontend
    newTag: main-ab98b2977291
    digest: sha256:aa86eebc2196399edb4116058e2ae0211a987068befdae15cc70fa7a8166ec83
