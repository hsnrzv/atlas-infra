apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas
  labels:
    app.kubernetes.io/name: atlas-ingress
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: ikigai-atlas
  # Optional / Proposed (docs/plan/PLAN-INFRASTRUCTURE-CICD.md, "TLS and ingress"): with cert-manager, an
  # environment overlay may add `cert-manager.io/cluster-issuer: <issuer>` so the `atlas-tls` Secret is
  # issued and renewed automatically. Not set here: cert-manager is not installed anywhere yet.
spec:
  # ingressClassName is intentionally unset: the cluster default IngressClass is used (Traefik on k3s,
  # the proposed default). Set it in the overlays once the platform decision (ADR-0003) is accepted.
  tls:
    - hosts:
        - atlas.example.com
      # Placeholder name; the Secret is created by cert-manager or the secret store, never committed.
      secretName: atlas-tls
  rules:
    # Placeholder host (RFC 2606 documentation domain). Each overlay patches its own host; the real
    # domain is an open decision.
    - host: atlas.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: atlas-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atlas-frontend
                port:
                  name: http
