apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-backend
  labels:
    app.kubernetes.io/name: atlas-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ikigai-atlas
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Start the new pod before stopping the old one; Flyway migrations must stay backward compatible
      # across this window (expand/contract, see docs/adr/0008-database-migration-execution.md).
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: ikigai-atlas
    spec:
      serviceAccountName: atlas-backend
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Spring lifecycle.timeout-per-shutdown-phase (20s) + preStop (5s) + headroom.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          # Tag/digest is set per environment via `images:` in environments/<env>/kustomization.yaml.
          image: ghcr.io/hsnrzv/atlas-backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: atlas-backend-config
          env:
            # Not committed: created per namespace from the secret store (see README.md#secrets-contract).
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: atlas-backend-db
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: atlas-backend-db
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-backend-db
                  key: SPRING_DATASOURCE_PASSWORD
          # The image sets -XX:MaxRAMPercentage=75, so the heap ceiling follows the memory limit
          # (1Gi -> ~768Mi heap, leaving headroom for metaspace, threads and direct buffers).
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            # Up to 150s for JVM start + Flyway on small burstable nodes.
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # Let the ingress/endpoints stop routing before Spring's graceful shutdown starts.
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
