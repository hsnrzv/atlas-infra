apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlas-backend
  labels:
    app.kubernetes.io/name: atlas-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ikigai-atlas
