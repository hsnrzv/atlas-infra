version: 2
updates:
  # Pinned GitHub Actions in .github/workflows/
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]

  # Pinned images in local/compose.yaml (postgres, nginx edge). Application images are built locally.
  - package-ecosystem: docker-compose
    directory: /local
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(local)"
    labels: ["dependencies", "local"]
    ignore:
      # PostgreSQL major upgrades need a dump/restore or pg_upgrade; do them deliberately.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
