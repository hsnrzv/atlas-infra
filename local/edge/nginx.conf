# Local edge proxy for the IKIGAI ATLAS full stack (LOCAL DEVELOPMENT ONLY).
# Mirrors the Kubernetes Ingress (apps/ingress/base/ingress.yaml):
#   /api/...            -> backend:8080
#   everything else     -> frontend:8080 (SPA, nginx-unprivileged)
# Local-only addition: /actuator/health[/...] -> backend, for smoke tests. The Kubernetes Ingress does NOT
# expose actuator endpoints; in clusters the kubelet probes them directly.

# Docker's embedded DNS. Resolving per request (variables in proxy_pass) lets the edge start, and recover,
# even while the backend or frontend container is (re)starting.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;

    set $atlas_backend http://backend:8080;
    set $atlas_frontend http://frontend:8080;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    location = /edge-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # `= /api` + `/api/` together match the Ingress `Prefix` path `/api`.
    location = /api {
        proxy_pass $atlas_backend;
    }

    location /api/ {
        proxy_pass $atlas_backend;
    }

    location = /actuator/health {
        proxy_pass $atlas_backend;
    }

    location /actuator/health/ {
        proxy_pass $atlas_backend;
    }

    location / {
        proxy_pass $atlas_frontend;
    }
}
